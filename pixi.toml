[workspace]
name = "ruby-flyover"
description = "A forge3d flight up Lamoille Canyon to Liberty Lake in the Ruby Mountains, Nevada, on 3DEP lidar"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]   # the data is built on GitHub Actions; the laptop renders with f3d

[tasks]
probe = "python scripts/probe.py"

[dependencies]
python      = "3.12.*"
pdal        = ">=2.8"
python-pdal = ">=3.4"
rasterio    = ">=1.4"
pyproj      = ">=3.6"
numpy       = ">=1.26"
scipy       = ">=1.12"
pillow      = ">=10.0"
shapely     = ">=2.0"
requests    = ">=2.31"

[pypi-dependencies]
planetary-computer = "*"
pystac-client = "*"
